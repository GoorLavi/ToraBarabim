<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <!--
    The 16px cut, drawn on the pixel grid. Fixed brand colors, same exception
    as LogoMark (decision 0014).
  -->
  <rect width="16" height="16" rx="3.5" fill="#6B2436" />
  <rect x="3" y="3" width="10" height="2" fill="#FFFFFF" />
  <rect x="4" y="6" width="2" height="5" fill="#FFFFFF" />
  <rect x="10" y="6" width="2" height="5" fill="#FFFFFF" />
  <rect x="7" y="7" width="2" height="4" fill="#E0B45E" />
  <rect x="3" y="12" width="10" height="1" fill="#FFFFFF" />
</svg>
