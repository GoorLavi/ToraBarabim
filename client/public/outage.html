<!doctype html>
<!--
  Served by CloudFront in place of a 502/503/504 from the origin (see
  errorResponses in infra/lib/site-stack.ts). By definition something is
  already broken when this renders, so it must never depend on anything else
  succeeding: no script, no external stylesheet, no hosted font, no image.
  Every style is inlined below and the font stack is system fonts only.
-->
<html dir="rtl" lang="he">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>תורה ברבים | האתר אינו זמין כרגע</title>
    <style>
      :root {
        color-scheme: light;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #f7f4f3;
        color: #201b1d;
        font-family: -apple-system, 'Segoe UI', Arial, sans-serif;
      }

      .card {
        max-width: 420px;
        width: 100%;
        background: #ffffff;
        border: 1px solid #e6dedf;
        border-radius: 16px;
        padding: 32px 24px;
        text-align: center;
        box-shadow: 0 1px 2px rgba(28, 26, 23, 0.04), 0 1px 3px rgba(28, 26, 23, 0.06);
      }

      .brand {
        margin: 0 0 16px;
        font-size: 15px;
        line-height: 22px;
        font-weight: 600;
        color: #6b2436;
      }

      .heading {
        margin: 0 0 12px;
        font-size: 28px;
        line-height: 36px;
        font-weight: 700;
      }

      .body {
        margin: 0;
        font-size: 17px;
        line-height: 26px;
        color: #6b6165;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <p class="brand">תורה ברבים</p>
      <h1 class="heading">האתר אינו זמין כרגע</h1>
      <p class="body">אנחנו כבר מטפלים בזה. נסו לרענן את הדף בעוד כמה דקות.</p>
    </main>
  </body>
</html>
